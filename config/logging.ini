[loggers]
keys=root,app

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=detailed

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_app]
level=WARNING
handlers=fileHandler,consoleHandler
qualname=app
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=WARNING
formatter=detailed
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=WARNING
formatter=detailed
args=('app.log', 'a')

[formatter_detailed]
format=%(asctime)s %(name)-12s %(levelname)-8s %(message)s
